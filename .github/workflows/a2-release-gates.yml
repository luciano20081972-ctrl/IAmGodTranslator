name: A2 Release Gates

on:
  pull_request:
    branches:
      - main
      - 'codex/iagt-v12-*'
      - codex/post-v11.6.1-downloader-acquisition-security-quality
      - 'v11.*'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Expected full SHA of the selected ref
        required: true
        type: string
      expected_tree:
        description: Expected full Git tree of that commit
        required: true
        type: string
      expected_build_id:
        description: Expected 64-character frontend build ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualification:
    name: A2 qualification (${{ matrix.profile }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        profile: [source, regression, postgres]
    services:
      postgres:
        image: ${{ matrix.profile == 'postgres' && 'postgres@sha256:07abc3f43c9395b0bdbbab36bc25ddb0e8d83cd4fcafb5fb7d6abe14ff156dd8' || '' }}
        env:
          POSTGRES_DB: godtranslator_rc2
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d godtranslator_rc2"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        shell: bash
    env:
      PROFILE: ${{ matrix.profile }}
      EVENT_SHA: ${{ github.sha }}
      MANUAL_SHA: ${{ inputs.expected_sha }}
      MANUAL_TREE: ${{ inputs.expected_tree }}
      MANUAL_BUILD: ${{ inputs.expected_build_id }}

    steps:
      - name: Checkout event source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify checkout identity
        id: source
        run: |
          [[ "$EVENT_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$EVENT_SHA" ]]
          tree=$(git rev-parse "$EVENT_SHA^{tree}")
          build=$(git show "$EVENT_SHA:IAmGodTranslator_Render_Deploy/config/frontend_build_id")
          [[ "$build" =~ ^[0-9a-f]{64}$ ]]
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            [[ "$MANUAL_SHA" == "$EVENT_SHA" && "$MANUAL_TREE" == "$tree" && "$MANUAL_BUILD" == "$build" ]]
          fi
          printf 'tree=%s\nbuild=%s\n' "$tree" "$build" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.12
        id: python-runtime
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'

      - name: Set up Node 24
        id: node-runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'

      - name: Install hashed wheels and verify dependency identity
        id: dependencies
        if: matrix.profile != 'source'
        run: |
          python -m venv "$RUNNER_TEMP/qualification-venv"
          python="$RUNNER_TEMP/qualification-venv/bin/python"
          "$python" -m pip --isolated --disable-pip-version-check install --index-url https://pypi.org/simple \
            --require-hashes --only-binary :all: -r .github/qualification/python-linux-x86_64-cp312.lock
          "$python" .github/qualification/check_dependencies.py
          printf '%s\n' "$RUNNER_TEMP/qualification-venv/bin" >> "$GITHUB_PATH"

      - name: Install locked Playwright and Chromium
        if: matrix.profile == 'regression'
        id: browser
        run: |
          browser="$RUNNER_TEMP/qualification-browser"
          mkdir "$browser"
          cp .github/qualification/browser/package*.json "$browser/"
          npm ci --prefix "$browser" --registry=https://registry.npmjs.org --ignore-scripts --no-audit --no-fund
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/qualification-browsers"
          node "$browser/node_modules/playwright/cli.js" install --with-deps chromium
          chromium=$(node -e 'console.log(require(process.argv[1]).chromium.executablePath())' "$browser/node_modules/playwright")
          test -x "$chromium"
          printf 'chromium=%s\nmodules=%s\n' "$chromium" "$browser/node_modules" >> "$GITHUB_OUTPUT"

      - name: Execute required profile and verify evidence
        id: evidence
        env:
          EXPECTED_TREE: ${{ steps.source.outputs.tree }}
          EXPECTED_BUILD: ${{ steps.source.outputs.build }}
          CHROMIUM: ${{ steps.browser.outputs.chromium }}
          NODE_MODULES: ${{ steps.browser.outputs.modules }}
        run: |
          args=()
          if [[ "$PROFILE" == regression ]]; then
            test -x "$CHROMIUM"
            test -d "$NODE_MODULES"
            args=(--chromium "$CHROMIUM" --node-modules "$NODE_MODULES")
          fi
          bash .github/qualification/run.sh "$PROFILE" "$EVENT_SHA" "$EXPECTED_TREE" "$EXPECTED_BUILD" \
            "$RUNNER_TEMP/a2-$PROFILE" "${args[@]}"

      - name: Retain qualification evidence including failed runs
        id: archive
        if: ${{ always() && steps.evidence.outcome != 'skipped' && steps.evidence.outcome != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a2-${{ matrix.profile }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/a2-${{ matrix.profile }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Enforce required step outcomes
        if: ${{ always() }}
        env:
          PYTHON: ${{ steps.python-runtime.outcome }}
          NODE: ${{ steps.node-runtime.outcome }}
          IDENTITY: ${{ steps.source.outcome }}
          DEPENDENCIES: ${{ steps.dependencies.outcome }}
          BROWSER: ${{ steps.browser.outcome }}
          EVIDENCE: ${{ steps.evidence.outcome }}
          ARCHIVE: ${{ steps.archive.outcome }}
        run: |
          [[ "$IDENTITY" == success && "$PYTHON" == success && "$NODE" == success ]]
          [[ "$EVIDENCE" == success && "$ARCHIVE" == success ]]
          if [[ "$PROFILE" != source ]]; then
            [[ "$DEPENDENCIES" == success ]]
          fi
          if [[ "$PROFILE" == regression ]]; then
            [[ "$BROWSER" == success ]]
          fi

  release-gate:
    name: A2 required release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: qualification
    if: ${{ always() }}
    steps:
      - name: Reject failed, cancelled or skipped qualification
        shell: bash
        env:
          RESULT: ${{ needs.qualification.result }}
        run: |
          if [[ "$RESULT" != success ]]; then
            printf 'Required qualification did not pass (%s).\n' "$RESULT" >&2
            exit 1
          fi
