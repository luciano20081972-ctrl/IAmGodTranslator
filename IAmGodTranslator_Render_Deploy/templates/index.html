<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IAmGodTranslator</title>
  <meta name="theme-color" content="#101014">
  <meta name="color-scheme" content="dark light">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/dark-hour-icon.svg" type="image/svg+xml">
  <!-- build:styles -->
  <link rel="stylesheet" href="/static/styles.css?v=11.6.2-ee7335cdc6c3f4eec1338d23807dacf04b51e1b34e8a8ddb9663c21273b8fbb2" integrity="sha256-7nM1zcbD9O7BM40jgH2s8EtR4bNOio3blmPCEnO4+7I=">
  <!-- end:styles -->
</head>
<body>
  <div class="shell">
    <header class="app-header">
      <a class="brand" href="#/home" aria-label="IAmGodTranslator home" data-brand-home>
        <span class="brand-mark" data-brand-mark role="img" aria-label="IAmGodTranslator home"></span>
        <span>
          <strong data-brand-name>IAmGodTranslator</strong>
          <small data-brand-tagline>Dark Hour Reader</small>
        </span>
      </a>
      <button class="global-search-trigger" id="globalSearchBtn" type="button" aria-label="Open search"><span>Search novels, chapters, actions</span></button>
      <nav class="top-nav" id="primaryNav" aria-label="Primary">
        <a href="#/home">Home</a>
        <a href="#/library">Library</a>
      </nav>
      <div class="shell-actions">
        <button id="jobCenterBtn" type="button" title="Activity">Activity</button>
        <details class="profile-menu" id="profileMenu">
          <summary class="account-chip" id="accountBtn">Guest</summary>
          <nav class="profile-menu-items" id="profileMenuItems" aria-label="Profile menu"></nav>
        </details>
      </div>
    </header>

    <aside id="activityBanner" class="activity-banner" hidden></aside>
    <aside id="notificationCenter" class="notification-center" hidden></aside>

    <main id="app" class="app-main" aria-live="polite">
      <section class="startup-reader-shell" aria-label="Opening reader">
        <p class="eyebrow">Continue Reading</p>
        <h1>I Am God</h1>
        <p>Opening your library...</p>
        <a class="button primary" href="#/library">Open Library</a>
      </section>
    </main>

    <nav id="mobileBottomNav" class="mobile-bottom-nav" aria-label="Mobile primary navigation"></nav>

    <dialog id="commandDialog" class="command-dialog">
      <form method="dialog">
        <div class="command-header">
          <input id="commandInput" type="search" placeholder="Search or type a command..." autocomplete="off">
          <button id="commandClose" type="button" aria-label="Close search">Close</button>
        </div>
        <section id="commandResults" class="command-results"></section>
      </form>
    </dialog>
  </div>

  <script id="appBrandConfig" type="application/json">
    {"name":"IAmGodTranslator","shortName":"IAGT","subtitle":"Dark Hour Reader","tagline":"Read, import, and translate novels","mark":"book-portal","browserTitle":"IAmGodTranslator","accessibleLogoLabel":"IAmGodTranslator home"}
  </script>
  <!-- build:scripts -->
  <script src="/static/vendor/supabase/supabase-2.119.2.js" integrity="sha256-iBavBNmRXbuhiC1vhPC0AtxAJoBjpj2cZtJPUvNxwmM="></script>
  <script src="/static/vendor/minisearch/minisearch-7.2.0.min.js?v=7.2.0" integrity="sha256-igW0J4XbRI8sGeJKaiEHIEyCVWX+T5WqabeWUrryboI="></script>
  <script src="/static/app.js?v=11.6.2-5ba13e7f717d8ca17f5e853633654935eb9779b54e393b757bfc9a2920b4df9e" integrity="sha256-W6E+f3F9jKF/XoU2M2VJNeuXebVOOTt1e/yaKSC0354="></script>
  <!-- end:scripts -->
</body>
</html>
